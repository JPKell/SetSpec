[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setspec"
description = "Every versioned data contract that crosses an application boundary: benchmark results, capability evidence, event/error envelopes, prompt records."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Local AI Suite contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # >=0.4.1, not >=0.4: `DataClassification` and the adapter value objects
    # (`AdapterIdentity`) arrive in 0.4.1, and `setspec.governance.v1` and
    # `setspec.model.v1` import them at module scope — 0.4.0 raises ImportError.
    # 0.4.1 also fixes the enum docstrings that five committed JSON Schema
    # snapshots embed as `description` text (docs/packages/setspec/schemas.md
    # §5), so a 0.4.0 install fails the snapshot contract test as well.
    "baseaicore>=0.4.1,<0.5",
    "pydantic>=2.9,<3",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    # >=9.0.3 excludes PYSEC-2026-1845 (vulnerable /tmp/pytest-of-{user} handling,
    # affecting pytest through 9.0.2). Matches the pin BaseAiCore already moved to.
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<6",
    "pytest-randomly>=3,<4",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "import-linter>=2.0,<3",
    "respx>=0.21,<1",
    # Phase 4's contract tests validate every golden against the *published* JSON Schema, not only
    # against the model that generated it. Without a real validator that assertion would be a
    # hand-rolled subset of draft 2020-12 written in this repository — which is to say, the thing
    # under test would also be the thing testing it. Test-only: nothing under `src/` imports it,
    # and `setspec` itself pulls in no validator (packaging standards §4).
    "jsonschema>=4.23,<5",
    "types-jsonschema>=4.23,<5",
]

[project.urls]
Homepage = "https://github.com/JPKell/SetSpec"
Documentation = "https://github.com/JPKell/SetSpec/tree/main/docs"
Changelog = "https://github.com/JPKell/SetSpec/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/setspec/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/setspec"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ruff formats Python code blocks inside markdown. `docs/` is a verbatim copy of the suite's
# master documents, shared byte-for-byte with the other nine repositories, so reformatting it
# here would desync it from its source and from every sibling copy. Excluded rather than
# reformatted; the documents are maintained where they originate.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "T20", "DTZ", "PTH", "D1", "BLE"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-m 'not live and not performance'"
markers = [
    "live: requires a real provider/GPU, never in default CI",
    "performance: performance budget assertions, excluded by default",
    "contract: public API/schema conformance in both directions",
]
testpaths = ["tests"]

[tool.coverage.run]
# The importable name, not the source path: CI installs the built distribution rather than an
# editable checkout (Packaging Standards §4), so coverage must find the package wherever it is
# installed. `paths` folds the two locations into one name in the report.
source = ["setspec"]
branch = true

[tool.coverage.paths]
source = ["src/setspec", "*/site-packages/setspec"]

[tool.coverage.report]
# Spec §18 and every phase's acceptance criteria say 95; the scaffold shipped 85.
fail_under = 95
show_missing = true
