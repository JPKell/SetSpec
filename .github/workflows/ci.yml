name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff format --check .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: mypy src tests

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: lint-imports

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: pytest -m "not live and not performance" --cov --cov-report=xml

  tests-314-early-warning:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      # Deliberately unlocked: this job resolves from the ranges in `pyproject.toml`, because
      # pinning versions that have no 3.14 wheels would defeat the purpose of an early warning
      # (requirements/README.md).
      - run: pip install -e ".[dev]"
      - run: pytest -m "not live and not performance"

  coverage:
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: pytest -m "not live and not performance" --cov --cov-report=term-missing --cov-fail-under=95

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: pytest -m contract

  # The three published guarantees get their own jobs rather than sharing `contracts`' single
  # red mark, because each answers a different question and the answers are acted on differently:
  # a snapshot diff means "bump the version", a golden failure means "the artifact is wrong", and
  # a cross-version failure means "a consumer at another version just broke".
  schema-snapshot-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      # ADR-0009 rule 7: a schema change without a version bump fails CI. The test regenerates
      # every published schema from its writer model and diffs it against the committed snapshot.
      - run: pytest tests/contract/test_schema_snapshots.py -m contract

  golden-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: pytest tests/contract/test_goldens.py -m contract

  cross-version-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      # Testing Standards §8.3, proven by the repository that makes the promise: a v1.0 reader
      # accepts a synthetic v1.1 golden without loss and refuses a synthetic v2.0 by major.
      - run: pytest tests/contract/test_cross_version.py -m contract

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # gitleaks scans *history*, and `actions/checkout` fetches a single commit by default.
        # For a push it is handed `<first-pushed>^..<last-pushed>`, so the parent of the first
        # pushed commit has to be in the object store; in a depth-1 clone it is not, and git
        # answers "unknown revision", which the action reports as exit code 1. It fails the same
        # way whether or not a secret exists, so a green run would not have meant anything either.
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      # Audit the locked set, not the job's own environment: a bare `pip-audit` here inspects an
      # environment containing only pip-audit itself and reports nothing (Security Standards §11).
      - run: pip-audit --require-hashes -r requirements/ci.lock
      - run: pip-audit --require-hashes -r requirements/release.lock
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The same pinned build chain the release uses, so a wheel that builds here is the wheel
      # that ships: `--no-isolation` takes the backend from this lock rather than re-resolving
      # hatchling from the index at build time.
      - run: pip install --require-hashes -r requirements/release.lock
      - run: python -m build --no-isolation
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  install-check:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - run: pip install dist/*.whl
      - run: python -c "import setspec"
      # The marker is easy to add to the source tree and easy to leave out of the built wheel, and
      # the failure is silent: a consumer's `mypy --strict` treats every import from an unmarked
      # package as untyped rather than erroring. Asserted against the *installed* wheel.
      - name: py.typed ships in the wheel
        run: |
          python -c "
          import pathlib, setspec
          marker = pathlib.Path(setspec.__file__).parent / 'py.typed'
          assert marker.is_file(), 'py.typed missing from the installed wheel'
          "
      # The schemas and goldens are package data (ADR-0009 rule 7), and package data is exactly
      # what a build is most likely to leave out silently: every test in this repository passes
      # against the source tree whether or not the files reach the wheel. This is the only job
      # that would notice, which is why it asserts against the *installed* distribution.
      - name: schemas and goldens ship in the wheel
        run: |
          python -c "
          from setspec import PUBLISHED_SCHEMAS, golden_payloads, json_schema_for
          for schema, versions in PUBLISHED_SCHEMAS.items():
              for version in versions:
                  assert json_schema_for(schema, version)['title'] == schema
                  goldens = golden_payloads(schema, version)
                  assert len(goldens) >= 3, f'{schema} {version} ships {len(goldens)} goldens'
          print(f'{len(PUBLISHED_SCHEMAS)} schemas with goldens loaded from the installed wheel')
          "
